##############################################################################
switch:
  - platform: template
    name: "Connection switch"
    id: connection_status_switch
    optimistic: true
    lambda: |-
      return $panelId->connected();
    icon: "mdi:shield-link-variant"
    turn_on_action:
      - switch.toggle: restart_switch
    turn_off_action:
      - lambda: |-
         $panelId->stop();

  - platform: restart
    id: restart_switch

  - platform: safe_mode
    name: "Safe Mode"    


debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    block:
      name: "Heap Max Block"
    loop_time:
      name: "Loop Time"   

 
